[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-state"
version = "0.1.0"
description = "Cross-distribution Linux state manager with selective, conflict-aware restoration."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Linux State Manager contributors" }]
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
linux-state = "linux_state.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
linux_state = ["rules/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
